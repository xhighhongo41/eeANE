[project]
name = "eeane"
version = "0.4.0.dev0"
description = "Embedding engine for Apple Neural Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "torch>=2.7,<2.8",
    "transformers>=4.57,<4.58",
    "coremltools>=9.0,<9.1",
    "numpy>=1.26,<3",
    "sentence-transformers>=5.0,<6",
    "sentencepiece>=0.2",
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "httpx2>=2,<3",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
