[project]
name = "eeane"
version = "1.0.0.dev0"
description = "Embedding engine for Apple Neural Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "coremltools>=9.0,<10",
    "numpy>=1.26,<3",
    "tokenizers>=0.22,<0.24",
]

[project.optional-dependencies]
compile = [
    "torch>=2.7,<2.8",
    "transformers>=4.57,<4.58",
    "sentencepiece>=0.2",
]

[project.scripts]
eeane = "eeane.cli:main"

[project.urls]
Repository = "https://github.com/xhighhongo41/eeANE"
Issues = "https://github.com/xhighhongo41/eeANE/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx2>=2,<3",
    "sentence-transformers>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
