[project]
name = "eeane"
version = "1.1.0.dev0"
description = "Run text embedding and reranking models on the Apple Neural Engine of Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-or-later"
keywords = [
    "apple-neural-engine",
    "ane",
    "coreml",
    "apple-silicon",
    "macos",
    "embeddings",
    "text-embeddings",
    "reranker",
    "modernbert",
    "bert",
    "xlm-roberta",
    "inference-server",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "coremltools>=9.0,<10",
    "numpy>=1.26,<3",
    "tokenizers>=0.22,<0.24",
]

[project.optional-dependencies]
compile = [
    "torch>=2.7,<2.8",
    "transformers>=4.57,<4.58",
    "sentencepiece>=0.2",
]

[project.scripts]
eeane = "eeane.cli:main"

[project.urls]
Homepage = "https://github.com/xhighhongo41/eeANE"
Repository = "https://github.com/xhighhongo41/eeANE"
Issues = "https://github.com/xhighhongo41/eeANE/issues"
Changelog = "https://github.com/xhighhongo41/eeANE#changelog"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx2>=2,<3",
    "sentence-transformers>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
