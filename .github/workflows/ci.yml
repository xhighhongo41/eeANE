# Minimal CI for eeANE (v0.5実装計画.md §4.7).
#
# Runs lint + unit tests on a macOS runner. The stub-engine test
# structure keeps every unit test runnable without an ANE; tests that
# need real model artifacts skip themselves automatically. ANE
# on-device and performance testing stays local by policy.
name: CI

on:
  push:
    branches:
      - main
      - "v0.*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Unit tests (pytest)
        run: uv run pytest -q
