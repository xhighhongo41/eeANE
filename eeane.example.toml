# eeANE server configuration example.
#
# Copy this file to ./eeane.toml (or ~/.config/eeane/eeane.toml) and edit
# it, or pass an explicit path with `eeane serve --config <path>`.
# Search order: --config > ./eeane.toml > ~/.config/eeane/eeane.toml >
# built-in defaults. CLI flags (--host/--port/--log-level) and the
# EEANE_API_KEY environment variable override the file.
#
# Relative paths are resolved against the directory this file lives in.

[server]
host = "127.0.0.1"          # Bind address. Use a LAN/tailnet IP to serve other machines.
port = 7997
log_level = "info"          # debug | info | warning | error
# api_key = "change-me"     # Enables Bearer auth on every endpoint except /health.
                            # EEANE_API_KEY takes precedence over this value.
                            # Keep this file private (chmod 600) when setting a key here.
# health_rate_limit = 60    # /health requests per minute per client IP. 0 disables.
# cache_root = "~/.cache/eeane"  # Compiled-model cache used to resolve minimal
                                 # [[models]] entries. Matches `eeane compile --out-dir`.
# default_load_policy = "on_demand"  # resident | on_demand, applied to any [[models]]
                                      # entry that omits load_policy. Default: on_demand
                                      # (no model loads at start-up; each one loads on its
                                      # first request and unloads again once idle).
# keep_alive = 300           # Seconds an idle on_demand model stays loaded before it is
                              # unloaded automatically; 0 unloads it as soon as it is idle.
                              # Applied to [[models]] entries that omit their own keep_alive.
# max_loaded_models = 2      # Cap on models held in memory at once. Unset: no limit.
                              # Loading a model beyond the cap unloads the longest-idle
                              # on_demand model first; resident models are never evicted.
# max_pending_requests = 500  # Cap on inference requests admitted at once (running +
                               # waiting); 0 means unlimited. Requests beyond the cap get 429
                               # immediately, with a Retry-After header.
# queue_timeout = 600         # Seconds an admitted request may wait its turn before it is
                               # abandoned with 503 and a Retry-After header; 0 disables the
                               # timeout. A request that has already started inference is
                               # never interrupted by this.
# coalesce_requests = true    # Merge an incoming request with an identical one (same model,
                               # same input) already running instead of computing it twice.
# graceful_shutdown_timeout = 30  # Seconds to wait for in-flight requests to finish on
                                   # SIGTERM/Ctrl-C before exiting. Unset (default): wait for
                                   # all of them to finish, however long that takes; no new
                                   # connections are accepted meanwhile.

# Any number of [[models]] entries may be listed; at least one embedding
# model is required, rerankers are optional (without one, /rerank answers
# 503). Within each kind the FIRST entry listed is the default model,
# used when a request does not name one; requests select any other entry
# with their `model` field.
#
# The minimal form gives only the id: kind, tokenizer, artifacts and the
# embedding width are resolved from the compiled-model cache written by
# `eeane compile`, loading the buckets its calibration recommends.

[[models]]
id = "cl-nagoya/ruri-v3-310m"
# normalize = true           # L2-normalize embeddings (the default). Embedding only.
# load_policy = "resident"   # resident | on_demand | disabled, overriding
                              # server.default_load_policy for this model only.
                              # "disabled" keeps the entry here without serving it.
# keep_alive = 60            # Overrides server.keep_alive for this model only.

[[models]]
id = "cl-nagoya/ruri-v3-reranker-310m"

# [[models]]
# id = "intfloat/multilingual-e5-base"

# The explicit form pins every field independently of the cache -- for
# artifacts moved elsewhere, or to serve a hand-picked bucket set.
# Requests are routed to the smallest bucket that fits; longer inputs
# are truncated to the largest one.

# [[models]]
# id = "my-pinned-model"
# kind = "embedding"           # embedding | reranker
# tokenizer = "models/compiled/my-model/tokenizer.json"  # Frozen by `eeane compile`.
# normalize = true
# # output_name = "embedding"  # Core ML output tensor; derived from kind when omitted.
# [models.artifacts]
# 128 = "models/compiled/my-model/s128_b1_eager_macos13.mlmodelc"
# 512 = "models/compiled/my-model/s512_b1_eager_macos13.mlmodelc"

# Optional, embedding models only: pairs a bucket with a second compiled artifact that infers
# two inputs per Neural Engine call instead of one. Produced by `eeane compile <model>
# --buckets <S> --batch 2`, run alongside the normal batch-1 compile; raised throughput for
# requests with many short inputs by about 25% in benchmarks on an M2 Mac. An id-only entry
# resolves this automatically once a batch-2 artifact is in the cache; the explicit form must
# spell it out here, and requires [models.artifacts] to be explicit too. No batch-2 artifacts
# configured: behavior is unchanged.
# [models.batch_artifacts]
# 128 = "models/compiled/my-model/s128_b2_eager_macos13.mlmodelc"
# 512 = "models/compiled/my-model/s512_b2_eager_macos13.mlmodelc"
